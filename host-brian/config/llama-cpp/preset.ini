version = 1

[qwen3.6-35b-a3b]
hf = unsloth/Qwen3.6-35B-A3B-MTP-GGUF:UD-Q4_K_M
parallel = 1
ctx-size = 196608
flash-attn = on
; 12 GiB card: fit keeps all layers on GPU and moves ~28 layers' experts to CPU.
; Long-context KV
cache-type-k = q4_0
cache-type-v = q4_0
; MTP has its own context/cache
; fit does not count the MTP draft context: 2560 peaks at ~11 GiB VRAM incl.
; desktop; 3584 wastes ~1.2 GiB for ~10% less tg.
fit-target = 2560
spec-type = draft-mtp
; MTP: +35% tg here; n-max 3 is within noise.
spec-draft-n-max = 2
spec-draft-type-k = q4_0
spec-draft-type-v = q4_0
; CPU / prompt processing
threads = 6
threads-batch = 6
batch-size = 2048
; fit budgets the larger compute buffer: pp ~1000 t/s vs ~520 at ub 512, same tg.
ubatch-size = 2048
; Text/coding only: don't waste VRAM on vision
no-mmproj = true
jinja = true
reasoning-preserve = true
temp = 0.6
top-p = 0.95
top-k = 20
min-p = 0.0
repeat-penalty = 1.0
presence-penalty = 0.0
load-on-startup = false

[gemma4-26b-a4b]
hf = unsloth/gemma-4-26B-A4B-it-GGUF:UD-Q4_K_M
parallel = 1
ctx-size = 131072
; 12 GiB card: fit keeps all layers on GPU and moves ~18 layers' experts to CPU.
flash-attn = on
cache-type-k = q4_0
cache-type-v = q4_0
; The repository supplies a matching MTP draft model.
; fit does not count the MTP draft context or mmproj: widen the margin.
fit-target = 4096
spec-type = draft-mtp
spec-draft-n-max = 2
spec-draft-ngl = all
spec-draft-type-k = q4_0
spec-draft-type-v = q4_0
threads = 6
threads-batch = 6
batch-size = 2048
ubatch-size = 512
; Do not disable mmproj: this model supports image input.
jinja = true
reasoning = on
temp = 1.0
top-p = 0.95
top-k = 64
min-p = 0.0
repeat-penalty = 1.0
presence-penalty = 0.0
load-on-startup = false

[qwen3.8-27b]
hf = unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_M
parallel = 1
ctx-size = 131072
; Dense 16.6 GB on a 12 GiB card: let fit choose the GPU layer split.
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
; Built-in Qwen3.8 MTP
; fit does not count the MTP draft context: 2560 peaks at ~10.6 GiB VRAM.
; RAM-bandwidth bound: ~7-8 tg even at 32k ctx (34 vs 26 GPU layers).
fit-target = 2560
spec-type = draft-mtp
; MTP: +70% tg; n-max 3/4 and ub 2048 are slower.
spec-draft-n-max = 2
spec-draft-ngl = all
threads = 6
threads-batch = 6
batch-size = 2048
ubatch-size = 512
no-mmproj = true
jinja = true
; Qwen3.8 default is xhigh; medium is the practical general-purpose setting.
chat-template-kwargs = {"reasoning_effort":"medium"}
reasoning-preserve = true
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
repeat-penalty = 1.0
presence-penalty = 0.0
load-on-startup = false

[inkling-2-mini]
; Mainline needs unsloth/Inkling-2-Mini-GGUF Mainline_Support/*.gguf_file renamed
; to .gguf (root files use Unsloth's layout) and llama.cpp >= b12611.
model = /models/inkling-2-mini/Inkling-2-Mini-UD-Q4_K_M.gguf
parallel = 1
ctx-size = 32768
; 24 physical blocks looped to 48 layers; blocks 0-19 store experts as NVFP4,
; which gfx1030 cannot run natively. With experts on CPU, op-offload upcasts
; them per ubatch: a ~6.5 GiB compute buffer floor (grows with ub and ctx).
; fit answers that with -ngl 7 (~10 tg, ~70 pp). All layers on GPU with all
; experts on CPU (n-cpu-moe >= 24) gives ~14 tg. Experts are CPU-bound: putting
; 1-2 blocks on GPU gains only ~2%, and threads 12 is slower than 6.
fit = off
gpu-layers = all
n-cpu-moe = 24
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
threads = 6
threads-batch = 6
batch-size = 2048
; Peak ~11 GiB VRAM incl. desktop. ub 256 doubles pp (~200 t/s) but needs
; ctx 16k to stay there; no-op-offload frees VRAM but pp drops to ~40 t/s.
ubatch-size = 128
jinja = true
; Template default is high; minimum effort does not fully disable reasoning.
chat-template-kwargs = {"reasoning_effort":"medium"}
; Upstream recommendation: temp 1.0, no truncation.
temp = 1.0
top-p = 1.0
top-k = 0
min-p = 0.0
load-on-startup = false
