version = 1

[qwen3.6-35b-a3b]
hf = unsloth/Qwen3.6-35B-A3B-MTP-GGUF:UD-Q4_K_M
parallel = 1
ctx-size = 196608
gpu-layers = all
flash-attn = on
; Explicit/manual VRAM fitting
fit = off
; MoE expert offload: start here on 24 GiB
n-cpu-moe = 8
; Long-context KV
cache-type-k = q4_0
cache-type-v = q4_0
; MTP has its own context/cache
spec-type = draft-mtp
spec-draft-n-max = 2
spec-draft-type-k = q4_0
spec-draft-type-v = q4_0
; CPU / prompt processing
threads = 6
threads-batch = 12
batch-size = 2048
ubatch-size = 512
; Text/coding only: don't waste VRAM on vision
no-mmproj = true
jinja = true
reasoning-preserve = true
temp = 0.6
top-p = 0.95
top-k = 20
min-p = 0.0
repeat-penalty = 1.0
presence-penalty = 0.0
load-on-startup = false

[gemma4-26b-a4b]
hf = unsloth/gemma-4-26B-A4B-it-GGUF:UD-Q4_K_M
parallel = 1
; Keep the 24 GiB GPU placement and context allocation explicit.
ctx-size = 131072
fit = off
gpu-layers = all
flash-attn = on
cache-type-k = q4_0
cache-type-v = q4_0
