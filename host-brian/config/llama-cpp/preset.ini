spec-draft-ngl = all
spec-draft-type-k = q4_0
spec-draft-type-v = q4_0
threads = 6
threads-batch = 12
batch-size = 2048
ubatch-size = 512
; Do not disable mmproj: this model supports image input.
jinja = true
