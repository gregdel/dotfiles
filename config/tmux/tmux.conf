# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @copycat_next 'n'
set -g @copycat_prev 'N'


# Prefix ######################################################################

set -g prefix C-Space
unbind C-b
bind-key -T prefix C-Space last-window


# Terminal ####################################################################

# TERM seen by applications inside tmux.
set -g default-terminal "tmux-256color"

# Forward focus events to applications such as Neovim.
set -g focus-events on

# Let applications negotiate extended modified-key reporting.
set -s extended-keys on

# Forward clipboard operations to the outer terminal using OSC52.
set -s set-clipboard external
set -s get-clipboard request


# General #####################################################################

set -g mouse off
set -g history-limit 200000

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

setw -g mode-keys vi
set -g status-keys vi

setw -g automatic-rename on
set -g allow-rename off

set -g display-time 1500
set -sg repeat-time 600

# Keep shared sessions usable across clients of different sizes.
set -g window-size smallest
setw -g aggressive-resize on

# Forward bells and monitor activity without adding visual noise.
set -g bell-action any
set -g visual-bell off
setw -g monitor-activity on
set -g visual-activity off

# Keep this explicit for existing terminals; extended-keys handles newer ones.
setw -g xterm-keys on

# Windows and splits ##########################################################

# New windows inherit the current pane's working directory.
bind c new-window -c "#{pane_current_path}"

# Intuitive split keys, also inheriting the current working directory.
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -fh -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -fv -c "#{pane_current_path}"

# Add screen-style window navigation
bind-key -r Space  next-window
bind-key -r BSpace previous-window
bind-key -r C-p    previous-window
bind-key -r C-n    next-window

# Panes #######################################################################

# Prefix + vim keys.
bind-key -r h select-pane -L
bind-key -r j select-pane -D
bind-key -r k select-pane -U
bind-key -r l select-pane -R

# Repeatable resize.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Pane zoom.
bind z resize-pane -Z

# Copy mode ###################################################################

bind Escape copy-mode

bind -T copy-mode-vi v     send-keys -X begin-selection
bind -T copy-mode-vi C-v   send-keys -X rectangle-toggle
bind -T copy-mode-vi n     send-keys -X search-again
bind -T copy-mode-vi N     send-keys -X search-reverse
bind -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi A     send-keys -X append-selection-and-cancel
bind -T copy-mode-vi D     send-keys -X copy-pipe-end-of-line-and-cancel
bind -T copy-mode-vi q     send-keys -X cancel
bind -T copy-mode-vi C-c   send-keys -X cancel
bind -T copy-mode-vi y     send-keys -X copy-selection-and-cancel

# Native session and window chooser ##########################################

bind s choose-tree -Zs
bind w choose-tree -Zw

# Popup and pane picker #######################################################

# Temporary shell in the current pane's working directory.
unbind p
bind p paste-buffer
bind y display-popup -E \
    -w 85% \
    -h 85% \
    -d "#{pane_current_path}"

bind q display-panes


# Status ######################################################################

set -g status on
set -g status-interval 5
set -g status-justify centre
set -g status-style 'fg=colour240,bg=colour233'

set -g status-left '#[fg=colour233,bg=colour39,bold] #S #[fg=colour240,bg=colour233,nobold]  #{user} '
set -g status-left-length 40

set -g status-right '#{?pane_in_mode,#[reverse] COPY MODE #[default],}#{?client_prefix,#[reverse] PREFIX #[default],}#[fg=colour245,bg=colour233] #{?session_many_attached,#{session_attached} watchers  }%H:%M:%S  %d-%b-%y  #H '
set -g status-right-length 150

set -g window-status-format '#[fg=colour245,bg=colour233] #I:#W#F '
set -g window-status-current-format '#[fg=black,bg=colour39,bold] #I:#W#F '
set -g window-status-current-style 'fg=black,bg=colour39'
set -g window-status-activity-style 'fg=colour75,bg=colour233'
set -g window-status-separator ''

set -g message-style 'fg=black,bg=colour39'
set -g message-command-style 'fg=black,bg=colour39'
set -g display-panes-active-colour colour245
set -g display-panes-colour colour233
setw -g mode-style 'fg=black,bg=colour39'
setw -g pane-border-style 'fg=colour238,bg=default'
setw -g pane-active-border-style 'fg=colour39,bg=default'
setw -g clock-mode-colour colour39
setw -g clock-mode-style 24


# Local configuration and TPM ################################################

# Keep TPM on the XDG path even when a server was started with an old value.
run-shell 'tmux set-environment -g TMUX_PLUGIN_MANAGER_PATH "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/plugins/"'

# Source local tmux conf if present.
run-shell 'local_conf="${XDG_CONFIG_HOME:-$HOME/.config}/tmux/local.conf"; [ -f "$local_conf" ] && tmux source-file "$local_conf"; :'

# Load TPM and the retained copycat plugin.
run '${XDG_CONFIG_HOME:-$HOME/.config}/tmux/plugins/tpm/tpm'

# Reload ######################################################################

# RCM deploys this file under XDG_CONFIG_HOME, not ~/.tmux.conf.
bind r run-shell 'tmux source-file "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/tmux.conf" && tmux display-message "tmux.conf reloaded"'
