directory: ~/music/Library
library: ~/music/beets_db.blb

plugins:
  - chroma
  - fetchart
  - embedart
  - lyrics
  - fromfilename
  - lastgenre
  - duplicates
  - edit
  - smartplaylist
  - spotify

import:
  move: yes
  write: yes

fetchart:
  sources:
    - filesystem
    - coverart
    - itunes

embedart:
  remove_art_file: no

smartplaylist:
  relative_to: ~/music/
  playlist_dir: ~/music/playlists/
  playlists:
    - name: imported_last_week.m3u
      query: "'added:-7d..' added+"
    - name: imported_last_month.m3u
      query: "'added:-31d..' added+"
    - name: imported_last_year.m3u
      query: "'added:-1y..' added+"
    - name: bad_quality.m3u
      query: "'bitrate:..127000'"

spotify:
  mode: list
  show_failures: yes
